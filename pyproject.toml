[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adl-capability-matrix"
version = "0.1.1"
description = "Claim-capped cluster matrix and compatible-build queue. Locked snapshot checker, not a live census."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["matrix*"]

[tool.setuptools.package-data]
matrix = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
